name: A2 real-target evidence

on:
  workflow_dispatch:
  create:

permissions:
  contents: read

jobs:
  a2-stage1-real-target:
    name: A2 real-target evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'evidence/a2-real-target/'))
    runs-on: ubuntu-latest
    env:
      A2_CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.A2_CHECKOUT_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check exact checkout binding
        run: test "$(git rev-parse HEAD)" = "$A2_CHECKOUT_SHA"
      - name: Check binutils is available
        run: objdump --version
      - name: Fetch and verify canonical Antagonizer target
        run: python tools/fetch_free_targets.py antagonizer-en
      - name: Generate exact-target Stage 1 inventory
        run: >-
          python scripts/generate_a2_capacity_inventory.py
          binaries/ANTAG_EN.EXE
          --output artifacts/a2-stage1-capacity-inventory.json
      - name: Generate exact-target raw literal reference probe
        run: >-
          python scripts/generate_a2_raw_literal_reference_probe.py
          binaries/ANTAG_EN.EXE
          --output artifacts/a2-raw-literal-reference-probe.json
      - name: Bind detached evidence provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          checkout_sha = os.environ["A2_CHECKOUT_SHA"]
          common_inputs = [
              ".github/workflows/a2-real-target.yml",
              "tools/fetch_free_targets.py",
              "tools/free-target-sources.json",
              "tools/le_image.py",
          ]
          artifacts = [
              (
                  Path("artifacts/a2-stage1-capacity-inventory.json"),
                  "a2-stage1-detached-provenance:v1",
                  common_inputs + [
                      "scripts/generate_a2_capacity_inventory.py",
                      "tools/le_disasm.py",
                  ],
              ),
              (
                  Path("artifacts/a2-raw-literal-reference-probe.json"),
                  "a2-raw-literal-detached-provenance:v1",
                  common_inputs + [
                      "scripts/generate_a2_raw_literal_reference_probe.py",
                  ],
              ),
          ]

          for artifact, schema, material_inputs in artifacts:
              data = json.loads(artifact.read_text(encoding="utf-8"))
              data["detached_evidence_provenance"] = {
                  "schema": schema,
                  "checkout_sha": checkout_sha,
                  "material_input_sha256": {
                      path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                      for path in material_inputs
                  },
              }
              artifact.write_text(
                  json.dumps(data, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Print compact review summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/a2-stage1-capacity-inventory.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          candidates = data["candidate_zero_regions"]
          fully = [c for c in candidates if c["fully_file_backed"]]
          fully_sorted = sorted(fully, key=lambda c: (-c["size"], c["address"]))
          with_refs = [c for c in candidates if c["incoming_direct_control_flow"]]

          print("A2 Stage 1 exact-target summary")
          print(f"target_sha256={data['target']['sha256']}")
          print(f"checkout_sha={data['detached_evidence_provenance']['checkout_sha']}")
          print(f"candidate_zero_regions={len(candidates)}")
          print(f"fully_file_backed_regions={len(fully)}")
          print(f"regions_with_incoming_direct_control_flow={len(with_refs)}")
          print(f"direct_control_flow_reference_count={data['direct_control_flow_reference_count']}")
          print("largest_fully_file_backed_regions:")
          for candidate in fully_sorted[:10]:
              print(
                  f"  address=0x{candidate['address']:x} size={candidate['size']} "
                  f"object={candidate['object']} incoming_direct_cf="
                  f"{len(candidate['incoming_direct_control_flow'])} reusable={candidate['reusable']}"
              )

          probe_path = Path("artifacts/a2-raw-literal-reference-probe.json")
          probe = json.loads(probe_path.read_text(encoding="utf-8"))
          print("A2 raw-literal exact-target summary")
          print(f"target_sha256={probe['target']['sha256']}")
          print(f"checkout_sha={probe['detached_evidence_provenance']['checkout_sha']}")
          print(f"literal_hit_count={probe['literal_hit_count']}")
          for hit in probe["literal_hits"]:
              print(
                  f"  candidate={hit['candidate_id']} candidate_offset=0x{hit['candidate_offset']:x} "
                  f"site=0x{hit['site_address']:x} source_object={hit['source_object']} "
                  f"source_file_offset=0x{hit['source_file_offset']:x}"
              )
          PY
      - name: Upload derived inventory
        uses: actions/upload-artifact@v4
        with:
          name: a2-stage1-capacity-inventory
          path: artifacts/a2-stage1-capacity-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload derived raw literal probe
        uses: actions/upload-artifact@v4
        with:
          name: a2-raw-literal-reference-probe
          path: artifacts/a2-raw-literal-reference-probe.json
          if-no-files-found: error
          retention-days: 7

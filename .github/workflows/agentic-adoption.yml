name: Temporary agentic-repo adoption

on:
  push:
    branches:
      - 'agent/adopt-agentic-repo-kit-0.1.9'

permissions:
  contents: write

concurrency:
  group: ascendancy-agentic-adoption
  cancel-in-progress: false

jobs:
  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire pinned agentic-repo-kit
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/agentic-repo-kit-0.1.9.pyz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$kit" \
            'https://github.com/kaaburgh/agentic-repo-kit/releases/download/v0.1.9/agentic-repo-kit-0.1.9.pyz'
          echo '79e914bc322873025f41db0ffa118bd037362b77708e4433bb854d8dd42b041e  '"$kit" | sha256sum -c -
          echo "KIT_PATH=$kit" >> "$GITHUB_ENV"

      - name: Refuse already-managed state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .agentic-repo.lock.json ]]; then
            echo 'repository already has an agentic-repo lock; temporary adoption workflow must not run' >&2
            exit 1
          fi

      - name: Build reviewed adoption plan or apply explicit approval
        shell: bash
        run: |
          set -euo pipefail
          plan_path='.agentic-adoption-plan.json'
          approval_path='.agentic-adoption-approved'

          python - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- **Depends on:** None. CF1 and T1 are complete, so the exact canonical pair and all four corroboration targets are available in cloud; use real bytes rather than synthetic fixtures when the task asks for real-target evidence.':
                  '- **Depends on:** CF1, T1\n- **Dependency note:** CF1 and T1 are complete, so the exact canonical pair and all four corroboration targets are available in cloud; use real bytes rather than synthetic fixtures when the task asks for real-target evidence.',
              '- **Depends on:** M1 (**Completed and verified**)':
                  '- **Depends on:** V1\n- **Milestone gate:** M1 must be **Completed and verified** before X1 starts; V1 is the milestone exit validation item.',
          }
          for old, new in replacements.items():
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new)
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f'unexpected roadmap migration state: old={old_count} new={new_count}: {old}'
                  )
          path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- ROADMAP.md; then
            rm -f "$plan_path" "$approval_path"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A ROADMAP.md "$plan_path" "$approval_path"
            git commit -m 'docs: normalize roadmap dependencies for repo-kit check'
          fi

          if [[ ! -e "$plan_path" ]]; then
            if [[ -e "$approval_path" ]]; then
              echo 'approval exists without a committed adoption plan' >&2
              exit 1
            fi
            python "$KIT_PATH" adopt . --output "$RUNNER_TEMP/agentic-adoption-plan.json"
            cp "$RUNNER_TEMP/agentic-adoption-plan.json" "$plan_path"
            python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('.agentic-adoption-plan.json').read_text(encoding='utf-8'))
          print('plan_id=' + plan['plan_id'])
          for item in plan['files']:
              print(f"{item['action']}: {item['path']}")
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$plan_path"
            git commit -m 'chore: record repo-kit adoption plan'
            git push origin HEAD
            exit 0
          fi

          if [[ ! -e "$approval_path" ]]; then
            echo 'adoption plan is committed and awaiting explicit reviewed plan approval'
            exit 0
          fi

          plan_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('.agentic-adoption-plan.json').read_text(encoding='utf-8'))['plan_id'])
          PY
          )"
          approved="$(tr -d '[:space:]' < "$approval_path")"
          if [[ "$approved" != "$plan_id" ]]; then
            echo "approval token does not match committed plan_id: approved=$approved plan=$plan_id" >&2
            exit 1
          fi

          python "$KIT_PATH" adopt . --apply "$plan_id"
          python "$KIT_PATH" check .

          git rm "$plan_path" "$approval_path" .github/workflows/agentic-adoption.yml
          git add .agentic-repo.lock.json \
            AGENTS.md CLAUDE.md \
            .github/copilot-instructions.md \
            .github/pull_request_template.md \
            .github/workflows/agentic-repo-check.yml \
            docs/agent-playbook.md \
            docs/roadmap-authoring.md \
            docs/re/README.md \
            docs/experiments/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: adopt agentic-repo-kit 0.1.9'
          git push origin HEAD

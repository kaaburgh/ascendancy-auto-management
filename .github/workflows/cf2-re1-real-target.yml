name: CF2 / RE1 real-target regressions

on:
  # These exact-target regressions intentionally stay out of pull_request/push
  # CI because acquisition currently depends on archive.org. Run them manually
  # when changing the relevant parser/disassembly/differential pipeline.
  workflow_dispatch:
    inputs:
      suite:
        description: Real-target regression to run
        required: true
        default: all
        type: choice
        options:
          - all
          - cf2
          - re1

jobs:
  cf2-real-target:
    if: ${{ inputs.suite == 'all' || inputs.suite == 'cf2' }}
    name: CF2 real-target regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check binutils is available
        run: objdump --version
      - name: Validate corrected CF2 pipeline on pinned targets
        run: python scripts/validate_cf2_real_targets.py --fetch

  re1-real-target:
    if: ${{ inputs.suite == 'all' || inputs.suite == 're1' }}
    name: RE1 real-target differential map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check binutils is available
        run: objdump --version
      - name: Fetch and verify pinned comparison targets
        run: python tools/fetch_free_targets.py
      - name: Generate RE1 differential map on pinned targets
        run: python scripts/generate_re1_diff_map.py --binaries binaries

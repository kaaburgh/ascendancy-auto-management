name: Apply PR19 review fixes
on:
  push:
    branches:
      - claude/review-ascendancy-pr-8-m2c6zy
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize staging patch context
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/pr19-review-fixes.patch')
          text = path.read_text(encoding='utf-8')
          bad = '-    status = next(item for item in fixtures if item["id"] == entry["id])["_role_status"]'
          good = '-    status = next(item for item in fixtures if item["id"] == entry["id"])["_role_status"]'
          if bad not in text:
              raise SystemExit('expected staging-context typo not found')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
      - name: Apply review fixes fail closed
        run: |
          git apply --check .github/pr19-review-fixes.patch
          git apply .github/pr19-review-fixes.patch
      - name: Focused fixture tests
        run: python -m unittest tests.test_validate_validation_fixtures tests.test_add_validation_fixture -v
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Documentation and fixture validation
        run: |
          python scripts/check-docs.py
          python scripts/validate_validation_fixtures.py --require-role single-planet-causal
          python -m py_compile scripts/add_validation_fixture.py scripts/validate_validation_fixtures.py
          git diff --check
      - name: Commit verified fixes and remove staging files
        run: |
          rm -f .github/pr19-review-fixes.patch .github/workflows/pr19-export.yml
          git config user.name kaaburgh
          git config user.email kaaburgh@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "fix: harden save fixture evidence contract"
          git push origin HEAD:claude/review-ascendancy-pr-8-m2c6zy

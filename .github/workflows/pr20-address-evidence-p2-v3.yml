name: PR20 address evidence-gate review v3

on:
  push:
    branches: [v1/operator-validation-state]
    paths: [.github/workflows/pr20-address-evidence-p2-v3.yml]

permissions:
  contents: write

jobs:
  address-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/operator-validation-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply corrected review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/pr20-address-evidence-p2.yml').read_text(encoding='utf-8')
          begin = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("          PY\n", begin)
          script = textwrap.dedent(source[begin:end])
          script = script.replace(
              '    mentioned_fixture_sha256: str | None = None,\n    observed_properties: dict | None = None,',
              '    mentioned_fixture_sha256: str | None = None,\n    observed_fixture_sha256: str | None = None,\n    observed_properties: dict | None = None,',
              1,
          )
          script = script.replace(
              '            "fixture_sha256": fixture_sha256,\n            "target_sha256": target_sha256,',
              '            "fixture_sha256": observed_fixture_sha256 or fixture_sha256,\n            "target_sha256": target_sha256,',
              1,
          )
          script = script.replace(
              '''t = t.replace('write_synthetic_source(self, "0" * 64)', 'write_synthetic_source(self, entry, mentioned_fixture_sha256="0" * 64)')''',
              '''t = t.replace('write_synthetic_source(self, "0" * 64)', 'write_synthetic_source(self, entry, mentioned_fixture_sha256="0" * 64, observed_fixture_sha256="0" * 64)')''',
              1,
          )
          exec(compile(script, '<pr20-review-fix>', 'exec'))
          PY
      - name: Focused validation
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python -m unittest tests.test_validate_validation_fixtures tests.test_add_validation_fixture -v
            first=$?
            if [ "$first" -eq 0 ]; then
              python scripts/validate_validation_fixtures.py
              first=$?
            fi
            exit "$first"
          } > /tmp/pr20-focused-validation.log 2>&1
          rc=$?
          cat /tmp/pr20-focused-validation.log
          exit "$rc"
      - name: Upload focused validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr20-focused-validation
          path: /tmp/pr20-focused-validation.log
      - name: Commit fix and remove one-shot workflows
        if: steps.focused.outcome == 'success'
        shell: bash
        run: |
          rm .github/workflows/pr20-address-evidence-p2.yml
          rm .github/workflows/pr20-address-evidence-p2-v2.yml
          rm .github/workflows/pr20-address-evidence-p2-v3.yml
          git config user.name "kaaburgh"
          git config user.email "kaaburgh@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "tools: bind fixture promotion to observed runtime properties"
          git push origin HEAD:v1/operator-validation-state
      - name: Fail if focused validation failed
        if: steps.focused.outcome != 'success'
        shell: bash
        run: exit 1

name: PR20 address evidence-gate review

on:
  push:
    branches: [v1/operator-validation-state]
    paths: [.github/workflows/pr20-address-evidence-p2.yml]

permissions:
  contents: write

jobs:
  address-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/operator-validation-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed structured runtime-evidence binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator = "scripts/validate_validation_fixtures.py"
          replace_once(
              validator,
              'RUNTIME_EVIDENCE_MARKER = "Evidence class: **runtime**"\nREPOSITORY_STORAGE = "repository"',
              'RUNTIME_EVIDENCE_MARKER = "Evidence class: **runtime**"\n'
              'OBSERVATION_BLOCK_MARKER = "<!-- validation-fixture-observations:v1 -->"\n'
              'OBSERVATION_BLOCK_SCHEMA = 1\n'
              'OBSERVED_RUNTIME_PROPERTY_FIELDS = (\n'
              '    "player_race_id",\n'
              '    "player_owned_planet_count",\n'
              '    "player_planet_names",\n'
              '    "planets_with_empty_current_action_at_load",\n'
              ')\n'
              'REPOSITORY_STORAGE = "repository"'
          )

          old_source = '''def check_source_record(\n    source: str, fixture_sha256: str, target_sha256: str\n) -> str | None:\n    """Return why `source` is not an experiment record for this fixture, or None.\n\n    Existing-file-ness is not enough: any repository file would pass, including\n    the policy documents that describe this very mechanism. A source has to be\n    an experiment record, and it has to pin the fixture whose properties it is\n    credited with establishing — otherwise the declaration cites a document that\n    never mentions the save.\n    """\n'''
          new_source = '''def parse_source_observations(text: str) -> tuple[dict[str, Any] | None, str | None]:\n    """Parse the single machine-readable runtime-property block from an experiment."""\n    marker_count = text.count(OBSERVATION_BLOCK_MARKER)\n    if marker_count != 1:\n        return None, (\n            f"runtime experiment must contain exactly one {OBSERVATION_BLOCK_MARKER!r} "\n            f"block; found {marker_count}"\n        )\n\n    tail = text.split(OBSERVATION_BLOCK_MARKER, 1)[1].lstrip()\n    lines = tail.splitlines()\n    if not lines or lines[0].strip() != "```json":\n        return None, "runtime observation marker must be followed by a fenced JSON block"\n    try:\n        fence_end = next(\n            index for index, line in enumerate(lines[1:], start=1) if line.strip() == "```"\n        )\n    except StopIteration:\n        return None, "runtime observation JSON block has no closing fence"\n\n    payload = "\\n".join(lines[1:fence_end])\n    try:\n        observations = json.loads(payload)\n    except json.JSONDecodeError as exc:\n        return None, f"runtime observation block is not valid JSON: {exc}"\n    if not isinstance(observations, dict):\n        return None, "runtime observation block must be a JSON object"\n    return observations, None\n\n\ndef check_source_record(source: str, fixture: dict[str, Any]) -> str | None:\n    """Return why `source` does not establish this fixture's declared runtime properties.\n\n    A runtime source must bind both identities and every role-critical property in\n    a structured observation block. Merely mentioning the save/target hashes in\n    prose is insufficient because a declaration could otherwise promote values\n    that the experiment never observed.\n    """\n    fixture_sha256 = fixture["sha256"]\n    target_sha256 = fixture["produced_by_target_sha256"]\n'''
          replace_once(validator, old_source, new_source)

          old_tail = '''    if target_sha256 not in text:\n        return (\n            f"source {source!r} never names produced target SHA-256 {target_sha256}; "\n            "the record is not bound to the target that produced this save"\n        )\n    return None\n'''
          new_tail = '''    if target_sha256 not in text:\n        return (\n            f"source {source!r} never names produced target SHA-256 {target_sha256}; "\n            "the record is not bound to the target that produced this save"\n        )\n\n    observations, observation_problem = parse_source_observations(text)\n    if observation_problem is not None:\n        return f"source {source!r} has no usable structured runtime observations: {observation_problem}"\n    assert observations is not None\n    if observations.get("schema") != OBSERVATION_BLOCK_SCHEMA:\n        return (\n            f"source {source!r} observation schema is {observations.get('schema')!r}; "\n            f"expected {OBSERVATION_BLOCK_SCHEMA}"\n        )\n    if observations.get("fixture_sha256") != fixture_sha256:\n        return f"source {source!r} structured observations are for a different fixture SHA-256"\n    if observations.get("target_sha256") != target_sha256:\n        return f"source {source!r} structured observations are for a different target SHA-256"\n\n    observed_properties = observations.get("runtime_properties")\n    if not isinstance(observed_properties, dict):\n        return f"source {source!r} structured observations have no runtime_properties object"\n    declared_properties = fixture["runtime_properties"]\n    for field in OBSERVED_RUNTIME_PROPERTY_FIELDS:\n        if field not in observed_properties:\n            return f"source {source!r} structured observations omit {field!r}"\n        if observed_properties[field] != declared_properties[field]:\n            return (\n                f"source {source!r} observed {field}={observed_properties[field]!r}, "\n                f"but the fixture declares {declared_properties[field]!r}"\n            )\n    return None\n'''
          replace_once(validator, old_tail, new_tail)
          replace_once(
              validator,
              '    source_problem = check_source_record(\n        source, fixture["sha256"], fixture["produced_by_target_sha256"]\n    )',
              '    source_problem = check_source_record(source, fixture)'
          )

          tests = "tests/test_validate_validation_fixtures.py"
          start = Path(tests).read_text(encoding="utf-8")
          helper_start = start.index("def write_synthetic_source(")
          helper_end = start.index("\n\ndef document_with", helper_start)
          new_helper = '''def write_synthetic_source(\n    case,\n    entry: dict,\n    *,\n    directory: str = "experiments",\n    target_sha256: str = fixtures.CANONICAL_TARGET_SHA256,\n    runtime_marker: bool = True,\n    include_observations: bool = True,\n    mentioned_fixture_sha256: str | None = None,\n    observed_properties: dict | None = None,\n) -> str:\n    """Create a throwaway runtime record carrying identities and observed properties."""\n    relative = f"docs/{directory}/_synthetic_fixture_record.md"\n    path = Path(fixtures.ROOT) / relative\n    path.parent.mkdir(parents=True, exist_ok=True)\n    fixture_sha256 = entry["sha256"]\n    lines = ["# synthetic record", ""]\n    if runtime_marker:\n        lines.append(fixtures.RUNTIME_EVIDENCE_MARKER)\n    lines.extend(\n        [\n            f"Target SHA-256 `{target_sha256}`.",\n            f"Pinned save SHA-256 `{mentioned_fixture_sha256 or fixture_sha256}`.",\n            "",\n        ]\n    )\n    if include_observations:\n        properties = observed_properties or {\n            field: copy.deepcopy(entry["runtime_properties"][field])\n            for field in fixtures.OBSERVED_RUNTIME_PROPERTY_FIELDS\n        }\n        observations = {\n            "schema": fixtures.OBSERVATION_BLOCK_SCHEMA,\n            "fixture_sha256": fixture_sha256,\n            "target_sha256": target_sha256,\n            "runtime_properties": properties,\n        }\n        lines.extend(\n            [\n                fixtures.OBSERVATION_BLOCK_MARKER,\n                "```json",\n                json.dumps(observations, indent=2),\n                "```",\n                "",\n            ]\n        )\n    path.write_text("\\n".join(lines), encoding="utf-8")\n    case.addCleanup(path.unlink, missing_ok=True)\n    return relative\n'''
          Path(tests).write_text(start[:helper_start] + new_helper + start[helper_end:], encoding="utf-8")
          t = Path(tests).read_text(encoding="utf-8")
          t = t.replace('write_synthetic_source(self, entry["sha256"])', 'write_synthetic_source(self, entry)')
          t = t.replace('write_synthetic_source(\n            self, entry["sha256"], directory="re"\n        )', 'write_synthetic_source(self, entry, directory="re")')
          t = t.replace('write_synthetic_source(self, "0" * 64)', 'write_synthetic_source(self, entry, mentioned_fixture_sha256="0" * 64)')
          t = t.replace('write_synthetic_source(\n            self, entry["sha256"], runtime_marker=False\n        )', 'write_synthetic_source(self, entry, runtime_marker=False)')
          t = t.replace('write_synthetic_source(\n            self, entry["sha256"], target_sha256="0" * 64\n        )', 'write_synthetic_source(self, entry, target_sha256="0" * 64)')
          anchor = '''    def test_experiment_for_a_different_target_does_not_satisfy_a_role(self):\n        entry, _ = multi_planet_fixture()\n        entry["runtime_properties"]["source"] = write_synthetic_source(self, entry, target_sha256="0" * 64)\n        declared = fixtures.check_declaration(document_with(entry))\n        status = declared[0]["_role_status"]\n        self.assertFalse(status["satisfied"])\n        self.assertIn("target SHA-256", status["reason"])\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit("test insertion anchor not found")
          extra = '''    def test_runtime_record_without_structured_observations_does_not_satisfy_a_role(self):\n        entry, _ = multi_planet_fixture()\n        entry["runtime_properties"]["source"] = write_synthetic_source(\n            self, entry, include_observations=False\n        )\n        declared = fixtures.check_declaration(document_with(entry))\n        status = declared[0]["_role_status"]\n        self.assertFalse(status["satisfied"])\n        self.assertIn("structured runtime observations", status["reason"])\n\n    def test_runtime_record_must_match_declared_planet_names(self):\n        entry, _ = multi_planet_fixture()\n        observed = {\n            field: copy.deepcopy(entry["runtime_properties"][field])\n            for field in fixtures.OBSERVED_RUNTIME_PROPERTY_FIELDS\n        }\n        observed["player_planet_names"] = ["Alpha I", "Beta II", "Wrong III"]\n        entry["runtime_properties"]["source"] = write_synthetic_source(\n            self, entry, observed_properties=observed\n        )\n        declared = fixtures.check_declaration(document_with(entry))\n        status = declared[0]["_role_status"]\n        self.assertFalse(status["satisfied"])\n        self.assertIn("player_planet_names", status["reason"])\n\n    def test_runtime_record_must_match_declared_empty_action_planets(self):\n        entry, _ = multi_planet_fixture()\n        observed = {\n            field: copy.deepcopy(entry["runtime_properties"][field])\n            for field in fixtures.OBSERVED_RUNTIME_PROPERTY_FIELDS\n        }\n        observed["planets_with_empty_current_action_at_load"] = []\n        entry["runtime_properties"]["source"] = write_synthetic_source(\n            self, entry, observed_properties=observed\n        )\n        declared = fixtures.check_declaration(document_with(entry))\n        status = declared[0]["_role_status"]\n        self.assertFalse(status["satisfied"])\n        self.assertIn("planets_with_empty_current_action_at_load", status["reason"])\n\n'''
          Path(tests).write_text(t.replace(anchor, anchor + extra, 1), encoding="utf-8")

          add_tests = "tests/test_add_validation_fixture.py"
          old_setup = '''        self.runtime_source.write_text(\n            "\\n".join(\n                [\n                    "# synthetic fixture runtime record",\n                    "",\n                    validator.RUNTIME_EVIDENCE_MARKER,\n                    f"Target SHA-256 `{validator.CANONICAL_TARGET_SHA256}`.",\n                    f"Pinned save SHA-256 `{validator.sha256_file(self.save)}`.",\n                    "",\n                ]\n            ),\n            encoding="utf-8",\n        )\n'''
          new_setup = '''        observations = {\n            "schema": validator.OBSERVATION_BLOCK_SCHEMA,\n            "fixture_sha256": validator.sha256_file(self.save),\n            "target_sha256": validator.CANONICAL_TARGET_SHA256,\n            "runtime_properties": {\n                "player_race_id": 0,\n                "player_owned_planet_count": 2,\n                "player_planet_names": ["Alpha I", "Beta II"],\n                "planets_with_empty_current_action_at_load": ["Beta II"],\n            },\n        }\n        self.runtime_source.write_text(\n            "\\n".join(\n                [\n                    "# synthetic fixture runtime record",\n                    "",\n                    validator.RUNTIME_EVIDENCE_MARKER,\n                    f"Target SHA-256 `{validator.CANONICAL_TARGET_SHA256}`.",\n                    f"Pinned save SHA-256 `{validator.sha256_file(self.save)}`.",\n                    "",\n                    validator.OBSERVATION_BLOCK_MARKER,\n                    "```json",\n                    json.dumps(observations, indent=2),\n                    "```",\n                    "",\n                ]\n            ),\n            encoding="utf-8",\n        )\n'''
          replace_once(add_tests, old_setup, new_setup)
          add_anchor = '''    def test_existing_id_is_not_silently_overwritten(self):\n'''
          add_extra = '''    def test_runtime_promotion_rejects_properties_not_observed_by_record(self):\n        self.assertEqual(\n            self.run_adder(\n                "--storage",\n                "operator-supplied",\n                "--evidence",\n                "runtime",\n                "--verified-by",\n                self.runtime_source_relative,\n                "--player-planet",\n                "Gamma III",\n            ),\n            1,\n        )\n\n'''
          replace_once(add_tests, add_anchor, add_extra + add_anchor)

          re5 = "docs/experiments/RE5-runtime-turn-path.md"
          re5_anchor = '''- mutable input used by the scenario: `resume.gam`, SHA-256 `fe7b29f63b685df3b098c0bd109a44e95c9a36a2116617b6c0363eb289a813d3`.\n\nRuntime/tooling:\n'''
          re5_block = '''- mutable input used by the scenario: `resume.gam`, SHA-256 `fe7b29f63b685df3b098c0bd109a44e95c9a36a2116617b6c0363eb289a813d3`.\n\nThe fixture registry consumes the following machine-readable summary of properties directly observed by this runtime experiment and its retained structural follow-up. The later follow-up below establishes that `Xerxes I` is the only owner-`0` record in this pinned save; the load precondition above establishes its empty current action.\n\n<!-- validation-fixture-observations:v1 -->\n```json\n{\n  "schema": 1,\n  "fixture_sha256": "fe7b29f63b685df3b098c0bd109a44e95c9a36a2116617b6c0363eb289a813d3",\n  "target_sha256": "8d91e89e978a4e39970f30b790c9c55adde59079c6108a34cdd286882e117b00",\n  "runtime_properties": {\n    "player_race_id": 0,\n    "player_owned_planet_count": 1,\n    "player_planet_names": [\n      "Xerxes I"\n    ],\n    "planets_with_empty_current_action_at_load": [\n      "Xerxes I"\n    ]\n  }\n}\n```\n\nRuntime/tooling:\n'''
          replace_once(re5, re5_anchor, re5_block)

          contract = "docs/re/validation-fixtures.md"
          contract_old = '''- `source` must name a Markdown experiment record under `docs/experiments/` that declares `Evidence class: **runtime**` and contains both this fixture's full SHA-256 and the full `produced_by_target_sha256`. Existence alone is not enough — otherwise any repository file, including this document, would pass — and a record that does not bind both save and target identities is not evidence for this fixture.\n'''
          contract_new = '''- `source` must name a Markdown experiment record under `docs/experiments/` that declares `Evidence class: **runtime**`, contains both this fixture's full SHA-256 and the full `produced_by_target_sha256`, and carries exactly one `<!-- validation-fixture-observations:v1 -->` fenced JSON block. That block independently pins the fixture/target identities plus `player_race_id`, the player-owned count/names, and the planets observed with an empty current action at load. Promotion fails closed if any declared role-critical property differs from the structured observations; merely mentioning the two hashes is not evidence for arbitrary properties.\n'''
          replace_once(contract, contract_old, contract_new)
          PY
      - name: Focused validation
        shell: bash
        run: |
          python -m unittest tests.test_validate_validation_fixtures tests.test_add_validation_fixture -v
          python scripts/validate_validation_fixtures.py
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/pr20-address-evidence-p2.yml
          git config user.name "kaaburgh"
          git config user.email "kaaburgh@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "tools: bind fixture promotion to observed runtime properties"
          git push origin HEAD:v1/operator-validation-state

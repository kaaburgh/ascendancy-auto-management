name: RE2 static seam

permissions:
  contents: write

on:
  push:
    branches:
      - agent/re2-ui-state-seam
  pull_request:
    paths:
      - scripts/generate_re2_ui_state_map.py
      - tests/test_generate_re2_ui_state_map.py
      - docs/re/auto-management-ui-state.md
      - docs/experiments/RE2-auto-management-ui-state-static.md
      - ROADMAP.md
      - .github/workflows/re2-static.yml
  workflow_dispatch:

jobs:
  roadmap-sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/re2-ui-state-seam
      - name: Update only RE2 roadmap section
        env:
          RE2_SECTION_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text()
          a = s.index('## RE2 — Identify the existing auto-management UI/state seam statically')
          b = s.index('\n---\n\n## RE3 —', a)
          new = base64.b64decode(os.environ['RE2_SECTION_B64']).decode()
          p.write_text(s[:a] + new + s[b:])
          PY
          if git diff --quiet -- ROADMAP.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ROADMAP.md
          git commit -m 'RE2: update roadmap outcome'
          git push origin HEAD:agent/re2-ui-state-seam

  re2-real-target:
    if: github.event_name != 'push'
    name: RE2 real-target UI/state seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify pinned comparison targets
        run: python tools/fetch_free_targets.py
      - name: Regenerate fail-closed RE2 static seam
        run: python scripts/generate_re2_ui_state_map.py --binaries binaries

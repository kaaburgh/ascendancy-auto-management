name: RE5 address review docs

on:
  push:
    branches:
      - agent/re5-runtime-turn-path

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update durable RE record and roadmap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          durable = Path("docs/re/auto-management-turn-path.md")
          text = durable.read_text(encoding="utf-8")
          heading = "## RE5 read-only override identity and runtime mapping (2026-08-14)"
          if heading in text:
              raise SystemExit("durable RE5 v2 section already exists; refusing duplicate update")
          section = r'''

          ## RE5 read-only override identity and runtime mapping (2026-08-14)

          This section is the durable record for the final read-only RE5 witness on canonical `ANTAG_EN.EXE` SHA-256 `8d91e89e978a4e39970f30b790c9c55adde59079c6108a34cdd286882e117b00`. It supersedes only the earlier statement that the Manual/override discriminator was still open; the perturbing marker result above remains historical negative evidence.

          ### Static identity of the separate override condition

          The player gate compare at static `0x3c102` is not identified by a bare hardcoded data VA. On the exact target, its file-backed 32-bit operand contains raw target offset `0x10d00`. The corresponding LE fixup is uniquely located at source page offset `0x104`, is a 32-bit internal relocation to **object 2**, and carries the same target offset `0x10d00`. Object 2 has static relocation base `0x90000`, so the relocation derives `0x90000 + 0x10d00 = 0xa0d00`.

          `scripts/run_re5_override_witness.py` reproduces this relationship before runtime sampling and fails closed if the gate instruction form changes, the source relocation is missing/ambiguous, the raw operand disagrees with the relocation, the target object is not unique, or the derived VA is not `0xa0d00`. Thus `0xa0d00` is the relocation-derived operand of the RE3 override compare, not a guessed DOS/4G address.

          ### Current-player identity used by the witness

          The current-player id is static `0x104bea`. Two independently used code references establish the relationship on the canonical target: the reference around `0x20de8` is in the race loop that skips the current player while processing non-player races, and the reference around `0x20dfc` is used to select the current-player race record before the separate `0x20e15 -> 0x3b220` call. Their LE relocations target object 2 offset `0x74bea`; object-2 base `0x90000` yields static `0x104bea`.

          ### Runtime data-object relationship

          The v2 witness derives runtime placement from five disjoint, file-backed initialized-data signatures:

          - `0x90895`, 40 bytes;
          - `0x90eb8`, 40 bytes;
          - `0x95078`, 40 bytes;
          - `0x987d0`, 32 bytes;
          - `0x998ba`, 15 bytes.

          The spans do not overlap. They were selected from separate initialized regions of object 2 so one duplicated/local coincidence cannot establish the mapping by itself. Every signature must match the stopped runtime mapping exactly once and all five must imply the same bias under

          `host(data_va) = anchor_host + (data_va - 0x37915) + bias`.

          Both fresh v2 acceptance processes independently derive `bias = -0xd000`. This is a bounded relationship for the exact canonical executable under the pinned runtime fixture; it is not asserted as a universal DOS/4G loader ABI rule.

          ### Bias-path liveness and stardate cross-check

          The independent stardate witness has data-model VA `0xa2f6c`. Under the derived bias it must resolve to exactly the same host address as the previously established RE2-anchor-relative `+0x5e657` witness. The v2 runner checks this equality before sampling, then reads stardate through the bias-derived `data_host` path. A wrong bias therefore fails closed instead of merely producing constant-zero control fields.

          In the two fresh v2 runs stardate advances `0 -> 235` in each process while the override remains zero. This provides a varying, live read through the same bias path at a VA above `0xa0d00`; the five signatures establish the mapping below it and the live stardate cross-check demonstrates that the same relationship reaches beyond the override location.

          ### Final bounded runtime evidence

          Published v2 evidence:

          - [`../experiments/RE5-override-witness-b795-run1.json`](../experiments/RE5-override-witness-b795-run1.json): 272 coherent samples, max gap `40.349 ms`, stardate `+235`, override values `[0]`;
          - [`../experiments/RE5-override-witness-b795-run2.json`](../experiments/RE5-override-witness-b795-run2.json): 273 coherent samples, max gap `33.350 ms`, stardate `+235`, override values `[0]`.

          Both are tied to runner revision `b795235b34c4b7d739a18e5245f45e398383cfcc`, source SHA-256 `fccdbd5c4eb5de55c2a0662018258f69aa95d805fffaa9a8edd5fe51156f782f`, artifact schema `ascendancy.re5-override-witness/v2`, and scenario contract `re5/manual-override-witness/v2`.

          Sampling does not prove the dword stayed zero at every instant between samples. The direct-reference audit narrows that gap for known direct writers and the pinned fixture recursively refuses the `flash.pop` startup condition, but an unknown indirect-address writer is not excluded. Broader gameplay semantics of the override remain unknown. The M1 conclusion is therefore scoped to the canonical target, pinned fixture, reproduced static identity, live runtime mapping and the two bounded normally progressing windows above.
          '''
          durable.write_text(text.rstrip() + "\n" + section.strip() + "\n", encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          replacements = {
              "the replacement witness performs no guest code or guest data writes and fails closed unless five independent initialized-data signatures derive one consistent runtime data-object relationship;":
              "the replacement witness performs no guest code or guest data writes, derives the override operand from the canonical gate's LE relocation, and fails closed unless five disjoint initialized-data signatures derive one consistent runtime data-object relationship;",
              "two fresh runs tied to published runner revision `a122801ebb0243d8f1d76151f2bbf8beb109bf54` passed the predeclared read-only oracle: 273 samples with stardate `+234`, and 272 samples with stardate `+232`; the separate RE3 override condition was zero in every coherent sample in both runs;":
              "two fresh v2 runs tied to published runner revision `b795235b34c4b7d739a18e5245f45e398383cfcc` passed the predeclared read-only oracle: 272 samples with stardate `+235`, and 273 samples with stardate `+235`; the statically identified RE3 override condition was zero in every coherent sample in both runs;",
              "the two repository-safe artifacts are [`RE5-override-witness-a122-run1.json`](./docs/experiments/RE5-override-witness-a122-run1.json) and [`RE5-override-witness-a122-run2.json`](./docs/experiments/RE5-override-witness-a122-run2.json);":
              "the two repository-safe artifacts are [`RE5-override-witness-b795-run1.json`](./docs/experiments/RE5-override-witness-b795-run1.json) and [`RE5-override-witness-b795-run2.json`](./docs/experiments/RE5-override-witness-b795-run2.json);",
              "static direct-reference inspection supports the bounded runtime result but does not rule out hypothetical indirect writers or establish broader gameplay semantics.":
              "the varying stardate control is resolved through the same bias-derived data path and cross-checked against the established anchor-relative witness; direct-writer static corroboration still does not rule out hypothetical indirect writers or establish broader gameplay semantics."
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"ROADMAP replacement count {count} != 1 for: {old[:80]!r}")
              text = text.replace(old, new)
          roadmap.write_text(text, encoding="utf-8")
          PY

      - name: Validate final tree
        run: |
          python -m py_compile scripts/run_re5_override_witness.py tests/test_re5_override_witness.py
          python -m unittest discover -s tests -v
          python scripts/check-docs.py
          git diff --check

      - name: Commit updates and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs/re/auto-management-turn-path.md
          git rm .github/workflows/re5-address-review-docs.yml
          git commit -m "RE5: document override witness identity"
          git push

name: RE5 apply follow-up docs

on:
  push:
    branches:
      - agent/re5-runtime-turn-path
    paths:
      - .github/workflows/re5-apply-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply durable follow-up evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import subprocess
          staged = "668307dc48248972f9a001ecedead63b7268bd8a"
          def old_file(path):
              return subprocess.check_output(["git", "show", f"{staged}:{path}"], text=True)
          exp_tail = old_file(".re5-docstage/experiment-tail.md")
          re_tail = old_file(".re5-docstage/re-tail.md")
          exp_tail = exp_tail.replace("All six fresh focused JSON files exist, but one scenario is intentionally `inconclusive`.", "All six fresh focused JSON files were captured and evaluated in the follow-up working set, but one scenario is intentionally `inconclusive`. The raw focused JSON files were not committed or uploaded and are not reconstructed here.")
          re_tail = re_tail.replace("All six fresh focused JSON files exist, but the Manual gate artifact is `inconclusive`.", "All six fresh focused JSON files were captured and evaluated in the follow-up working set, but the Manual gate artifact is `inconclusive`. The raw focused JSON files were not committed or uploaded and are not reconstructed here.")
          p = Path("docs/experiments/RE5-runtime-turn-path.md")
          text = p.read_text(encoding="utf-8")
          marker = "## Interpretation\n"
          if marker not in text:
              raise SystemExit("experiment marker missing")
          p.write_text(text.split(marker, 1)[0].rstrip() + "\n\n" + exp_tail.rstrip() + "\n", encoding="utf-8")
          p = Path("docs/re/auto-management-turn-path.md")
          text = p.read_text(encoding="utf-8")
          marker = "## RE5 runtime confirmation\n"
          if marker not in text:
              raise SystemExit("RE5 marker missing")
          p.write_text(text.split(marker, 1)[0].rstrip() + "\n\n" + re_tail.rstrip() + "\n", encoding="utf-8")
          front_b64 = ""
          section_b64 = ""
          p = Path("ROADMAP.md")
          text = p.read_text(encoding="utf-8")
          front_start = text.index("**Current front of the path:**")
          front_end = text.index("\n\n---", front_start)
          new_front = base64.b64decode(front_b64).decode("utf-8")
          text = text[:front_start] + new_front + text[front_end:]
          start = text.index("## RE5 — Runtime-confirm the per-turn self-management call path\n")
          end = text.index("\n---\n\n# Track A — Architecture decisions", start)
          new_section = base64.b64decode(section_b64).decode("utf-8")
          p.write_text(text[:start] + new_section.rstrip() + text[end:], encoding="utf-8")
          PY
      - name: Validate follow-up tree
        run: |
          python -m py_compile scripts/re5_followup_model.py scripts/run_re5_runtime_turn_path_followup.py scripts/run_re5_runtime_turn_path_followup_capture.py tests/test_re5_followup_contract.py
          python -m unittest tests.test_run_re5_runtime_turn_path tests.test_re5_followup_contract -v
          python scripts/check-docs.py
          git diff --check
      - name: Commit durable follow-up state and remove bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs/experiments/RE5-runtime-turn-path.md docs/re/auto-management-turn-path.md
          git rm .github/workflows/re5-apply-followup.yml .re5-followup-docs.patch
          git commit -m "RE5: reopen inconclusive Manual gate evidence"
          git push

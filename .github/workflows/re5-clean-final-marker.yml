name: RE5 clean final marker

on:
  push:
    branches:
      - agent/re5-runtime-turn-path
    paths:
      - .github/workflows/re5-clean-final-marker.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary CI marker and cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f tests/.re5-followup-ci-trigger
          git rm tests/.re5-followup-ci-trigger .github/workflows/re5-clean-final-marker.yml
          git commit -m "chore: remove final RE5 CI marker"
          git push

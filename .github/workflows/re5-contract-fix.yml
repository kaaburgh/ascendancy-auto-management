name: RE5 artifact contract fix

on:
  push:
    branches:
      - agent/re5-runtime-turn-path
    paths:
      - .github/workflows/re5-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/re5-runtime-turn-path
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused-artifact contract fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          script = 'scripts/run_re5_runtime_turn_path.py'
          replace_one(
              script,
              'DEFAULT_WINDOW_SECONDS = 7.0\n\n\nclass RE5Error',
              'DEFAULT_WINDOW_SECONDS = 7.0\nRESULT_SCHEMA = 2\nEXPERIMENT_CONTRACT = "ascendancy.re5-runtime-turn-path/contract-v2"\n\n\nclass RE5Error',
          )
          replace_one(
              script,
              '        record = json.loads(path.read_text(encoding="utf-8"))\n        if record.get("status") != "passed" or record.get("target") != expected["target"] or record.get("fixture") != expected["fixture"]:\n',
              '        record = json.loads(path.read_text(encoding="utf-8"))\n        if record.get("schema") != RESULT_SCHEMA or record.get("experiment_contract") != EXPERIMENT_CONTRACT:\n            raise RE5Error(f"focused artifact experiment contract mismatch: {path.name}")\n        if record.get("status") != "passed" or record.get("target") != expected["target"] or record.get("fixture") != expected["fixture"]:\n',
          )
          replace_one(
              script,
              '        if len(record.get("scenarios", [])) != 1 or record["scenarios"][0].get("name") != spec.name:\n            raise RE5Error(f"focused artifact scenario mismatch: {path.name}")\n        window = record.get("window_seconds")\n',
              '        if len(record.get("scenarios", [])) != 1 or record["scenarios"][0].get("name") != spec.name:\n            raise RE5Error(f"focused artifact scenario mismatch: {path.name}")\n        scenario = record["scenarios"][0]\n        if scenario.get("status") != "passed":\n            raise RE5Error(f"focused artifact scenario status mismatch: {path.name}")\n        try:\n            validate_scenario(spec, scenario["turn_trace"])\n        except (KeyError, TypeError, RE5Error) as exc:\n            raise RE5Error(f"focused artifact current-oracle validation failed: {path.name}: {exc}") from exc\n        window = record.get("window_seconds")\n',
          )
          replace_one(
              script,
              '        scenarios.append(record["scenarios"][0])\n',
              '        scenarios.append(scenario)\n',
          )
          replace_count(
              script,
              '        "schema": 1,\n        "roadmap_item": "RE5",',
              '        "schema": RESULT_SCHEMA,\n        "experiment_contract": EXPERIMENT_CONTRACT,\n        "roadmap_item": "RE5",',
              2,
          )

          tests = 'tests/test_run_re5_runtime_turn_path.py'
          replace_count(
              tests,
              '                record = {\n                    "status": "passed",',
              '                record = {\n                    "schema": re5.RESULT_SCHEMA,\n                    "experiment_contract": re5.EXPERIMENT_CONTRACT,\n                    "status": "passed",',
              2,
          )
          replace_one(
              tests,
              '                    "fixture": fixture if spec.name != "managed-control" else {"id": "wrong"},',
              '                    "fixture": fixture if spec.name != "manual-control" else {"id": "wrong"},',
          )
          insert = '''\n    def test_focused_aggregation_rejects_stale_experiment_contract(self):\n        target = {"filename": "ANTAG.EXE", "size": 610863, "sha256": re5.re4.TARGET_SHA256}\n        fixture = {"id": "fixture", "resume": {"sha256": re5.RESUME_SHA256}}\n        with tempfile.TemporaryDirectory() as td:\n            artifacts = Path(td)\n            for spec in re5.SCENARIOS:\n                record = {\n                    "schema": re5.RESULT_SCHEMA,\n                    "experiment_contract": (\n                        "ascendancy.re5-runtime-turn-path/contract-v1"\n                        if spec.name == "manual-control" else re5.EXPERIMENT_CONTRACT\n                    ),\n                    "status": "passed",\n                    "target": target,\n                    "fixture": fixture,\n                    "window_seconds": 7.0,\n                    "scenarios": [{"name": spec.name, "status": "passed", "turn_trace": self._trace()}],\n                }\n                re5.focused_result_path(artifacts, spec.name).write_text(json.dumps(record), encoding="utf-8")\n            with self.assertRaisesRegex(re5.RE5Error, "experiment contract mismatch"):\n                re5.aggregate_focused_results(artifacts, {"target": target, "fixture": fixture})\n\n    def test_focused_aggregation_revalidates_loaded_trace_with_current_oracle(self):\n        target = {"filename": "ANTAG.EXE", "size": 610863, "sha256": re5.re4.TARGET_SHA256}\n        fixture = {"id": "fixture", "resume": {"sha256": re5.RESUME_SHA256}}\n        with tempfile.TemporaryDirectory() as td:\n            artifacts = Path(td)\n            for spec in re5.SCENARIOS:\n                if spec.name in {"manual-control", "manual-gate-probe"}:\n                    trace = self._trace(None, None, state="00000000")\n                elif spec.name == "managed-gate-probe":\n                    trace = self._trace(None, 65.0, final_action="7e")\n                elif spec.name == "managed-control":\n                    trace = self._trace(None, None)  # stale passed artifact; invalid under current oracle\n                elif spec.name == "managed-policy-suppressed":\n                    trace = self._trace(None, None)\n                else:\n                    trace = self._trace(4800.0, None)\n                record = {\n                    "schema": re5.RESULT_SCHEMA,\n                    "experiment_contract": re5.EXPERIMENT_CONTRACT,\n                    "status": "passed",\n                    "target": target,\n                    "fixture": fixture,\n                    "window_seconds": 7.0,\n                    "scenarios": [{"name": spec.name, "status": "passed", "turn_trace": trace}],\n                }\n                re5.focused_result_path(artifacts, spec.name).write_text(json.dumps(record), encoding="utf-8")\n            with self.assertRaisesRegex(re5.RE5Error, "current-oracle validation failed"):\n                re5.aggregate_focused_results(artifacts, {"target": target, "fixture": fixture})\n\n'''
          replace_one(tests, '\n\n\nif __name__ == "__main__":\n', insert + '\nif __name__ == "__main__":\n')

          doc = 'docs/experiments/RE5-runtime-turn-path.md'
          replace_one(
              doc,
              'The original six-scenario confirmation was executed as focused invocations because the surrounding container tool imposes a shorter single-command wall-time than six fresh DOSBox startups combined. Focused runs now preserve separate `run-<scenario>.json` files. When all six are present, the runner re-verifies target/fixture identity and scenario membership, recomputes `summarize_causality`, and writes `run-aggregate.json` without starting DOSBox.\n\nFor this review correction, only the three load-bearing negative scenarios were rerun because they require the new progress witness. The aggregate was then produced from those three new artifacts plus the three already-preserved positive corrected-head artifacts (`managed-gate-probe`, `managed-control`, `managed-action-write-suppressed`). No extra DOSBox launch was made for aggregation or paused-write safety.\n',
              'The original six-scenario confirmation was executed as focused invocations because the surrounding container tool imposes a shorter single-command wall-time than six fresh DOSBox startups combined. Focused runs preserve separate `run-<scenario>.json` files. Current artifacts use schema `2` and carry experiment contract `ascendancy.re5-runtime-turn-path/contract-v2`. When all six are present, the runner requires that exact contract and target/fixture identity, verifies scenario membership/window consistency, **re-runs the current `validate_scenario()` oracle on every loaded trace**, recomputes `summarize_causality`, and only then writes `run-aggregate.json` without starting DOSBox. Missing or older contract IDs fail closed; changing an incompatible instrumentation/oracle contract requires bumping this ID.\n\nThe earlier review aggregate was produced before this explicit contract binding and mixed three newly rerun negative artifacts with three preserved positive artifacts from an earlier corrected head. Those observations remain the documented target evidence, but that pre-contract aggregate is now treated as historical validation rather than as an input accepted by the current aggregator. The current tool deliberately does **not** retroactively stamp legacy artifacts with a new contract. No additional DOSBox launch was made for this artifact-integrity follow-up. Future focused target runs will emit contract-bound artifacts directly.\n',
          )
          PY
          python -m py_compile scripts/run_re5_runtime_turn_path.py tests/test_run_re5_runtime_turn_path.py
          python -m unittest tests.test_run_re5_runtime_turn_path -v
          python scripts/check-docs.py
          git diff --check
      - name: Commit fix and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/re5-contract-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_re5_runtime_turn_path.py tests/test_run_re5_runtime_turn_path.py docs/experiments/RE5-runtime-turn-path.md .github/workflows/re5-contract-fix.yml
          git commit -m 'RE5: bind focused artifacts to oracle contract'
          git push origin HEAD:agent/re5-runtime-turn-path

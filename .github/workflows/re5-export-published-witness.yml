name: RE5 export published witness

on:
  push:
    branches:
      - agent/re5-runtime-turn-path

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: re5-published-witness
          path: |
            scripts/run_re5_override_witness.py
            tests/test_re5_override_witness.py
          if-no-files-found: error

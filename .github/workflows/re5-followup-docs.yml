name: RE5 follow-up docs apply

on:
  push:
    branches: [agent/re5-runtime-turn-path]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger RE5 follow-up docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged documentation
        run: python .re5-docstage/apply_docs.py
      - name: Validate docs and focused RE5 tests
        run: |
          python -m py_compile scripts/run_re5_runtime_turn_path.py scripts/re5_followup_model.py scripts/run_re5_runtime_turn_path_followup.py scripts/run_re5_runtime_turn_path_followup_capture.py
          python -m unittest tests.test_run_re5_runtime_turn_path tests.test_re5_followup_contract -v
          python scripts/check-docs.py
          git diff --check
      - name: Commit clean result
        run: |
          rm -rf .re5-docstage
          rm -f .github/workflows/re5-followup-docs.yml
          git config user.name kaaburgh
          git config user.email kaaburgh@gmail.com
          git add -A
          git commit -m 'RE5: reopen Manual gate investigation'
          git push

name: RE5 review fix

on:
  push:
    branches:
      - agent/re5-runtime-turn-path

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/re5-runtime-turn-path
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded RE5 review fixes
        run: |
          python tools/_re5_review_runner_fix.py
          python tools/_re5_review_tests_fix.py
          python tools/_re5_review_experiment_fix.py
          python tools/_re5_review_docs_fix.py
          python -m py_compile scripts/run_re5_runtime_turn_path.py
          python -m unittest tests.test_run_re5_runtime_turn_path -v
          python scripts/check-docs.py
      - name: Commit fixes and remove temporary bridge
        run: |
          rm tools/_re5_review_runner_fix.py tools/_re5_review_tests_fix.py tools/_re5_review_experiment_fix.py tools/_re5_review_docs_fix.py .github/workflows/re5-review-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'RE5: address causal evidence review'
          git push origin HEAD:agent/re5-runtime-turn-path

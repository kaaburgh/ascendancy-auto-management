name: RE5 review fixes bridge

on:
  push:
    branches:
      - agent/re5-runtime-turn-path
    paths:
      - .github/workflows/re5-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/re5-runtime-turn-path
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded RE5 review fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/re5-payload-*.txt | base64 -d > /tmp/re5-review.tar.gz
          tar -xzf /tmp/re5-review.tar.gz
          python review_patch.py
          rm review_patch.py
          python -m py_compile scripts/run_re5_runtime_turn_path.py tests/test_run_re5_runtime_turn_path.py
          python -m unittest tests.test_run_re5_runtime_turn_path -v
          python scripts/check-docs.py
          git diff --check
      - name: Commit fixes and remove temporary bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/re5-review-fixes.yml .github/re5-payload-*.txt
          git add ROADMAP.md docs/experiments/RE5-runtime-turn-path.md docs/re/auto-management-turn-path.md scripts/run_re5_runtime_turn_path.py tests/test_run_re5_runtime_turn_path.py
          git commit -m 'RE5: add turn-progress positive control'
          git push origin HEAD:agent/re5-runtime-turn-path

name: T2 independent wdump oracle

on:
  # Keep this independent format-oracle regression explicit rather than adding
  # a large Open Watcom download to every pull request. Run it when the LE
  # parser, T2 producer, or format assumptions change.
  workflow_dispatch:

jobs:
  t2-wdump:
    name: T2 wdump cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup pinned Open Watcom snapshot
        uses: open-watcom/setup-watcom@ccb20bafa51ccae40a02010c009946c44e2b9a89
        with:
          version: "2.0"
          tag: "2026-08-01-Build"
          target: "linux"
      - name: Verify required tools are available
        run: |
          objdump --version
          command -v wdump
      - name: Fetch and verify pinned targets
        run: python tools/fetch_free_targets.py
      - name: Regenerate T2 with independent wdump oracle
        run: |
          python scripts/generate_t2_static_bundle.py \
            --binaries binaries \
            --wdump "$(command -v wdump)"
          git diff --exit-code -- docs/re/static-analysis/t2

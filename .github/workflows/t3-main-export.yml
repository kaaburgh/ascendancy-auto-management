name: Temporary T3 main snapshot export

on:
  push:
    branches:
      - agent/t3-rebase-snapshot

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: t3-main-snapshot
          path: .
          include-hidden-files: true
          if-no-files-found: error

name: Temporary T3 rebased code apply

on:
  push:
    branches:
      - agent/t3-rebase-build

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and apply current-main T3 code
        shell: bash
        run: |
          set -euo pipefail
          cat .t3-rebase/code.0 .t3-rebase/code.1 | base64 -d | xz -d > "$RUNNER_TEMP/t3.patch"
          echo 'fa90b869fe37a921295457f14d42f2d2b63082030a739b9196daeea4bc445e61  '"$RUNNER_TEMP/t3.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/t3.patch"
          git apply "$RUNNER_TEMP/t3.patch"
          git rm -r .t3-rebase
          git rm .github/workflows/t3-rebase-code.yml
      - name: Focused T3 and reused-runner tests
        run: |
          python -m unittest \
            tests.test_run_t3_multi_planet_fixture \
            tests.test_run_re4_runtime_state \
            tests.test_run_re5_runtime_turn_path \
            tests.test_re5_override_witness -v
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Validate current declarations and docs
        run: |
          python scripts/validate_validation_fixtures.py
          python scripts/check-docs.py
          python -m py_compile \
            scripts/run_t3_multi_planet_fixture.py \
            scripts/run_re4_runtime_state.py \
            scripts/run_re5_runtime_turn_path.py \
            scripts/run_re5_override_witness.py
          git diff --check
      - name: Pinned agentic repository contract
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/agentic-repo-kit-0.1.10.pyz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$kit" \
            'https://github.com/kaaburgh/agentic-repo-kit/releases/download/v0.1.10/agentic-repo-kit-0.1.10.pyz'
          echo '6581d35cd47debfc619c6660a2964799eeaddb1d397af8db5925639ec7c45f55  '"$kit" | sha256sum -c -
          python "$kit" check .
      - name: Commit rebased T3 code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts tests .github
          git diff --cached --check
          git commit -m 'T3: add operator-save runtime qualifier'
          git push origin HEAD:agent/t3-rebase-build

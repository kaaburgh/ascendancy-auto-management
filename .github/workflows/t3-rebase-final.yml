name: Temporary T3 rebased evidence finalizer

on:
  push:
    branches:
      - agent/t3-rebase-build

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and apply final T3 evidence
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .t3-rebase-final/final.patch.xz.b64 | xz -d > "$RUNNER_TEMP/t3-final.patch"
          echo '3fdbf18b86f2f173d1a7e348fbedab71a4f60d9addc4b4877ea85979d377b519  '"$RUNNER_TEMP/t3-final.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/t3-final.patch"
          git apply "$RUNNER_TEMP/t3-final.patch"
          git rm -r .t3-rebase-final
          git rm .github/workflows/t3-rebase-final.yml
      - name: Focused T3 and fixture tests
        run: |
          python -m unittest \
            tests.test_run_t3_multi_planet_fixture \
            tests.test_run_re4_runtime_state \
            tests.test_run_re5_runtime_turn_path \
            tests.test_re5_override_witness \
            tests.test_validate_validation_fixtures -v
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Validate exact operator role from attached artifact copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/operator-fixture"
          # The operator payload is not committed; current-main validation of the
          # structured promotion authority is exercised without weakening storage.
          python scripts/validate_validation_fixtures.py --require-role m1-multi-planet
          python scripts/validate_validation_fixtures.py --require-role single-planet-causal
      - name: Documentation syntax and diff checks
        run: |
          python scripts/check-docs.py
          python -m py_compile \
            scripts/run_t3_multi_planet_fixture.py \
            scripts/run_re4_runtime_state.py \
            scripts/run_re5_runtime_turn_path.py \
            scripts/run_re5_override_witness.py
          git diff --check
      - name: Pinned agentic repository contract
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/agentic-repo-kit-0.1.10.pyz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$kit" \
            'https://github.com/kaaburgh/agentic-repo-kit/releases/download/v0.1.10/agentic-repo-kit-0.1.10.pyz'
          echo '6581d35cd47debfc619c6660a2964799eeaddb1d397af8db5925639ec7c45f55  '"$kit" | sha256sum -c -
          python "$kit" check .
      - name: Commit final rebased T3 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md docs tools tests scripts .github
          git diff --cached --check
          git commit -m 'T3: promote operator multi-planet fixture'
          git push origin HEAD:agent/t3-rebase-build

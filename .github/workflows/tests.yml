name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Automatic CI intentionally avoids standalone external-artifact availability
# checks and real-target regressions that require live archive.org downloads.
# Exact-target clean-checkout regressions remain available only through the
# manual cf2-re1-real-target.yml and re2-static.yml workflows.
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The static-analysis tools shell out to objdump. It is preinstalled on
      # ubuntu-latest; assert it so a runner image change fails loudly here
      # rather than silently skipping the disassembly tests.
      # Unpiped on purpose: the default shell is `bash -e` without pipefail, so
      # piping to `head` would mask a missing objdump behind head's exit 0.
      - name: Check binutils is available
        run: objdump --version
      # The suite must stay network-free: download paths are exercised against
      # synthetic file:// fixtures, and LE parsing against synthetic images.
      - run: python -m unittest discover -s tests -v

  cf3-debugger:
    name: CF3 debugger capability
    runs-on: ubuntu-latest
    # Hosted-runner/package-manager stalls must fail closed instead of leaving
    # the whole PR merge gate in progress indefinitely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The current ubuntu-latest image is Ubuntu Noble, which publishes
      # DOSBox 0.74-3's ncurses debugger separately. The smoke is target-free:
      # it installs a BPINT on a six-byte synthetic COM loop, resumes, and
      # requires a byte-exact debugger memory dump after the breakpoint fires.
      # A pseudo-TTY makes the interactive debugger scriptable without
      # weakening the evidence to "the package installs".
      - name: Install DOSBox debugger
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dosbox-debug
          dosbox-debug -version
      - name: Prove breakpoint and guest-state observation
        run: python scripts/validate_cf3_debugger.py

  cf4-ui-smoke:
    name: CF4 UI automation capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This public smoke deliberately uses the redistributable demo, not the
      # private retail fixture. It proves the hosted runner can start a real
      # Ascendancy guest, inject XTEST mouse/keyboard input, and capture real
      # 640x480 UI transitions. Exact-target V1 uses the same harness with the
      # maintainer-supplied retail tree verified by its committed manifest.
      - name: Install UI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dosbox xvfb ffmpeg x11-utils libxtst6
          dosbox -version
      - name: Fetch and verify pinned playable demo
        run: |
          python tools/fetch_demo.py --dest game/demo
          python tools/fetch_demo.py --verify --dest game/demo
      - name: Drive real demo UI and capture transitions
        run: |
          python scripts/run_cf4_ui_validation.py \
            --game-dir game/demo \
            --dosbox dosbox \
            --exe ASCEND.EXE \
            --expected-exe-sha256 0183b75cb44ce52b52ba57baf2b9521e21a7611e487a1ebb5b768067441960a9 \
            --fixture-manifest tools/demo-runtime-manifest.json \
            --actions tools/cf4-ui-demo-smoke.json \
            --artifacts artifacts/cf4-ui-demo
      - name: Upload bounded UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf4-ui-demo
          path: artifacts/cf4-ui-demo/
          if-no-files-found: error

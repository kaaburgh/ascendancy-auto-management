name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The static-analysis tools shell out to objdump. It is preinstalled on
      # ubuntu-latest; assert it so a runner image change fails loudly here
      # rather than silently skipping the disassembly tests.
      # Unpiped on purpose: the default shell is `bash -e` without pipefail, so
      # piping to `head` would mask a missing objdump behind head's exit 0.
      - name: Check binutils is available
        run: objdump --version
      # The suite must stay network-free: download paths are exercised against
      # synthetic file:// fixtures, and LE parsing against synthetic images.
      - run: python -m unittest discover -s tests -v

  cf2-real-target:
    name: CF2 real-target regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check binutils is available
        run: objdump --version
      # This is intentionally separate from the network-free unit suite. The
      # four publisher-distributed executables are fetched through the CF1
      # fail-closed manifest, hash-verified, kept under git-ignored binaries/,
      # and then analysed by the repository CLIs from this exact checkout.
      - name: Validate corrected CF2 pipeline on pinned targets
        run: python scripts/validate_cf2_real_targets.py --fetch

  re1-real-target:
    name: RE1 real-target differential map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check binutils is available
        run: objdump --version
      # RE1 is an analysis-tool change and exact target bytes are lawfully
      # fetchable in cloud. Exercise the repository command on a clean checkout
      # rather than accepting only synthetic pairing tests.
      - name: Fetch and verify pinned comparison targets
        run: python tools/fetch_free_targets.py
      - name: Generate RE1 differential map on pinned targets
        run: python scripts/generate_re1_diff_map.py --binaries binaries

  cf3-demo-acquisition:
    name: CF3 demo acquisition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Keep live redistribution-source validation out of the deterministic
      # unit suite. The fetcher is fail-closed on the complete archive and all
      # extracted member hashes and writes only under git-ignored game/.
      - name: Fetch and verify pinned playable demo
        run: |
          python tools/fetch_demo.py --dest game/demo
          python tools/fetch_demo.py --verify --dest game/demo

  cf3-debugger:
    name: CF3 debugger capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The current ubuntu-latest image is Ubuntu Noble, which publishes
      # DOSBox 0.74-3's ncurses debugger separately. The smoke is target-free:
      # it installs a BPINT on a six-byte synthetic COM loop, resumes, and
      # requires a byte-exact debugger memory dump after the breakpoint fires.
      # A pseudo-TTY makes the interactive debugger scriptable without
      # weakening the evidence to "the package installs".
      - name: Install DOSBox debugger
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dosbox-debug
          dosbox-debug -version
      - name: Prove breakpoint and guest-state observation
        run: python scripts/validate_cf3_debugger.py
